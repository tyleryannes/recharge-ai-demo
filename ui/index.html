<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14202E;
    --ink-2: #1B2A3B;
    --ink-3: #22344A;
    --line: #2B3B4E;
    --text: #EAF0F5;
    --muted: #8FA1B3;
    --dim: #5E7186;
    --live: #F5B94A;
    --ok: #6FCF97;
    --bad: #E5695B;
    --lane-brief: #8FA1B3;
    --lane-macro: #4DB6C8;
    --lane-trends: #A77BE0;
    --lane-competitors: #F0876A;
    --lane-assembly: #EAF0F5;
    --lane-assembly-2: #EAF0F5;
    --lane-followup: #E8C46B;
    --lane-factcheck: #6FCF97;
    --lane-report: #EAF0F5;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* Header and map stay put; the trace and report scroll on their own, like a CI page. */
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    display: grid;
    grid-template-rows: auto auto auto minmax(0, 1fr);
    height: 100vh;
    overflow: hidden;
  }
  a { color: inherit; }
  button, textarea, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Explicit rows: the composer is display:none most of the time, and without these the panels would
     slide up into the map's auto row and split the height with it. */
  header { grid-row: 1; display: grid; gap: 10px; padding: 18px 32px 8px; }
  .composer { grid-row: 2; }
  .map { grid-row: 3; }
  .panels { grid-row: 4; }
  /* Wide and short: the brief runs the full width in two or three lines so the map gets the height. */
  .brief {
    margin: 0;
    font-size: clamp(16px, 1.35vw, 21px);
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.005em;
    max-width: none;
    font-variation-settings: "opsz" 32;
  }
  .side { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; }
  .status {
    display: flex;
    align-items: center;
    gap: 18px;
    color: var(--muted);
    white-space: nowrap;
  }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--text); }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  .live.running .live-dot { background: var(--live); }
  .live.completed .live-dot { background: var(--ok); }
  .live.failed .live-dot { background: var(--bad); }
  #clock { min-width: 4ch; }
  select {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 10px;
    max-width: 260px;
  }
  .status a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  .status a:hover { color: var(--text); }

  /* Replay: appears once a run has finished. Plays the recorded events back on their own clock. */
  .replay { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .replay button {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    color: var(--text);
  }
  .replay button.primary { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 600; }
  .replay button:hover { border-color: var(--muted); }
  .speeds { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .speeds button { border: 0; border-radius: 0; padding: 5px 10px; color: var(--muted); }
  .speeds button + button { border-left: 1px solid var(--line); }
  .speeds button[aria-pressed="true"] { background: var(--ink-3); color: var(--text); }
  .replay input[type="range"] { width: 220px; accent-color: var(--live); }
  #replay-clock { min-width: 5ch; text-align: right; color: var(--text); }

  .brief.placeholder { color: var(--muted); font-weight: 400; }
  .status button.link { background: none; border: 0; padding: 0; color: var(--muted); border-bottom: 1px solid var(--line); cursor: pointer; }
  .status button.link:hover { color: var(--text); }

  /* The composer: where a new brief is written. Opens from "New brief"; open by default when there are no runs yet. */
  .composer { padding: 4px 32px 14px; }
  .composer form {
    max-width: 880px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 6px 10px 18px;
    transition: border-color .15s;
  }
  .composer form:focus-within { border-color: var(--live); }
  .composer textarea {
    display: block;
    width: 100%;
    min-height: 74px;
    resize: none;
    background: transparent;
    border: 0;
    padding: 12px 12px 8px 0;
    font-size: 19px;
    line-height: 1.35;
    color: var(--text);
  }
  .composer textarea:focus { outline: none; }
  .composer textarea::placeholder { color: var(--dim); }
  .composer-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-right: 4px; }
  .examples { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--dim); font-size: 13px; }
  .examples button {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .examples button:hover { color: var(--text); border-color: var(--muted); }
  .composer-actions { display: flex; align-items: center; gap: 12px; }
  .composer .note { color: var(--dim); font-size: 13px; }
  .composer button.start {
    white-space: nowrap;
    background: var(--text);
    color: var(--ink);
    border: 0;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button.start:disabled { opacity: .5; cursor: default; }
  .form-error { color: var(--bad); font-size: 14px; padding: 6px 0 0; }
  .form-error:empty { display: none; }
  /* While composing, the page is about the new brief: the old run's controls go, the panels dim. */
  body.composing .replay, body.composing .view-toggle, body.composing .map { display: none !important; }
  body.composing .panels { opacity: .22; pointer-events: none; }
  body.composing .composer form { max-width: 980px; }
  body.composing .composer textarea { min-height: 128px; font-size: 21px; }

  /* Full-screen report: a reading column, nothing else. */
  .report-head { display: flex; justify-content: flex-end; margin: 0 0 -6px; }
  body.report-full header, body.report-full .composer, body.report-full .map, body.report-full .trace { display: none !important; }
  body.report-full .panels { grid-row: 1 / -1; grid-template-columns: 1fr; border-top: 0; }
  body.report-full .report { padding: 40px 32px 80px; }
  body.report-full .report > * { max-width: 74ch; margin-left: auto; margin-right: auto; }
  body.report-full article.report { max-width: 74ch; }
  body.report-full article.report p, body.report-full article.report li { font-size: 17.5px; line-height: 1.55; }
  body.report-full article.report h2 { font-size: 22px; margin-top: 34px; }
  body.report-full .evidence-box { max-width: 74ch; margin-left: auto; margin-right: auto; }

  .map { padding: 4px 16px 0; overflow-x: auto; position: relative; }
  .map svg { display: block; width: 100%; min-width: 1040px; height: auto; }
  #office { display: block; width: 100%; height: clamp(320px, 48vh, 500px); }
  .view-toggle { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; color: var(--muted); }
  .view-toggle .view-label { padding: 5px 10px; border-right: 1px solid var(--line); font-size: 14px; }
  .view-toggle button { background: transparent; border: 0; padding: 5px 12px; color: var(--muted); cursor: pointer; }
  .view-toggle button + button { border-left: 1px solid var(--line); }
  .view-toggle button[aria-pressed="true"] { background: var(--ink-3); color: var(--text); }
  .map text { font-family: var(--font); fill: var(--muted); }
  .map .stage { font-size: 13px; fill: var(--dim); }
  .map .label { font-size: 15.5px; fill: var(--text); font-weight: 500; }
  .map .sub { font-size: 12.5px; fill: var(--muted); }
  .map .node.running .sub { fill: var(--lane); }
  .map .node { cursor: pointer; }
  .map .node.selected .halo { stroke: var(--text); stroke-opacity: .9; }
  .map .halo { fill: none; stroke: transparent; stroke-width: 1.5; }
  .map .core { fill: var(--ink-2); stroke-width: 2.5; }
  .map .node.queued .core { stroke-dasharray: 3 3; stroke: var(--dim); }
  .map .node.ghost .core { stroke-dasharray: 3 3; stroke: var(--dim); fill: none; }
  .map .node.ghost .label { fill: var(--dim); font-weight: 400; }
  .map .ring { fill: none; stroke-width: 2.5; opacity: 0; }
  .map .node.running .ring { animation: ring 1.4s ease-out infinite; }
  .map .node.completed .core { fill: var(--lane); }
  .map .node.completed .tick { stroke: var(--ink); }
  .map .tick { fill: none; stroke: transparent; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .map .node.failed .core { fill: var(--bad); stroke: var(--bad); }
  .map .cross { stroke: transparent; stroke-width: 2.2; stroke-linecap: round; }
  .map .node.failed .cross { stroke: var(--ink); }
  .map .edge { fill: none; stroke-width: 2; stroke-opacity: .28; }
  .map .edge.done { stroke-opacity: .6; }
  .map .edge.flow { stroke-opacity: .9; stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }

  .panels {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 4fr);
    grid-template-rows: minmax(0, 1fr);
    border-top: 1px solid var(--line);
    min-height: 0;
  }
  .panels > section { min-height: 0; overflow: auto; padding: 18px 28px 40px; }
  .trace { border-right: 1px solid var(--line); padding-top: 0 !important; }
  /* Stays put while the trace scrolls, so the reader always knows whose reasoning this is. */
  .trace-head { position: sticky; top: 0; z-index: 1; background: var(--ink); padding-top: 18px; box-shadow: 0 8px 12px -8px var(--ink); }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  .panel-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .panel-head .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .task { margin: 0 0 14px; color: var(--muted); }
  .ghost-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .ghost-btn:hover { color: var(--text); }
  .empty { color: var(--dim); margin: 32px 0; max-width: 40ch; }

  ol.trace-list { list-style: none; margin: 0; padding: 0; }
  ol.trace-list > li {
    display: grid;
    grid-template-columns: 4ch minmax(0, 1fr);
    gap: 14px;
    padding: 7px 0;
    border-top: 1px solid var(--ink-3);
  }
  ol.trace-list > li:first-child { border-top: 0; }
  ol.trace-list time { color: var(--dim); font-size: 13px; padding-top: 2px; }
  /* In the all-agents feed every entry says who did it; the colour is the agent's lane on the map. */
  .who {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--lane);
    border-left: 3px solid var(--lane);
    padding-left: 7px;
    margin-bottom: 3px;
  }
  .entry.thinking .body { color: var(--muted); font-style: italic; border-left: 2px solid var(--line); padding-left: 10px; }
  .entry.text .body { white-space: pre-wrap; }
  .entry.search .q { font-weight: 500; }
  .entry.search ul { margin: 6px 0 0; padding-left: 16px; color: var(--muted); font-size: 14px; }
  .entry.search ul a { text-decoration: none; border-bottom: 1px solid var(--line); }
  .entry.search .none { color: var(--dim); font-size: 14px; margin-top: 4px; }
  .entry .headline { font-weight: 600; }
  .entry ul.findings { margin: 6px 0 0; padding-left: 0; list-style: none; }
  .entry ul.findings li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 4px 0; }
  .entry ul.findings .conf { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; }
  .conf.high { background: var(--ok); }
  .conf.medium { background: var(--live); }
  .conf.low { background: var(--dim); }
  .entry .evidence { color: var(--muted); font-size: 14px; }
  .entry .gaps ol { margin: 6px 0 0; padding-left: 18px; }
  .entry .gaps .why { color: var(--muted); font-size: 14px; }
  .entry .contra p { margin: 4px 0; color: var(--muted); font-size: 14px; }
  .entry.done .body { color: var(--muted); }
  .entry.failed .body { color: var(--bad); }
  .verdict-list { margin: 6px 0 0; padding: 0; list-style: none; }
  .verdict-list li { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 4px 0; align-items: start; }

  .pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid;
    white-space: nowrap;
  }
  .pill.supported { color: var(--ok); border-color: var(--ok); }
  .pill.unsupported { color: var(--muted); border-color: var(--dim); }
  .pill.contradicted { color: var(--bad); border-color: var(--bad); }

  .report-status { color: var(--muted); margin: 6px 0 14px; min-height: 26px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .now-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .now-list li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
  .now-list .who { margin: 0; }
  .now-list .what { color: var(--muted); }
  article.report { max-width: 62ch; }
  article.report h1, article.report h2, article.report h3 { font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
  article.report h1 { font-size: 24px; }
  article.report h2 { font-size: 18px; margin-top: 26px; }
  article.report h3 { font-size: 16px; }
  article.report p, article.report li { font-size: 15.5px; }
  article.report li { margin: 4px 0; }
  .claim {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 5px;
    margin: 0 1px 0 3px;
    border-radius: 4px;
    vertical-align: 3px;
    cursor: pointer;
    border: 1px solid var(--dim);
    color: var(--muted);
  }
  .claim.supported { border-color: var(--ok); color: var(--ok); }
  .claim.unsupported { border-color: var(--dim); color: var(--muted); border-style: dashed; }
  .claim.contradicted { border-color: var(--bad); color: var(--bad); background: rgba(229,105,91,.12); }
  .claim.active { background: var(--ink-3); }
  .evidence-box {
    position: sticky;
    bottom: 0;
    margin-top: 20px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  .evidence-box:empty { display: none; }
  .evidence-box .src { color: var(--muted); }

  @keyframes ring { 0% { r: 14; opacity: .8; } 100% { r: 28; opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  @media (prefers-reduced-motion: reduce) {
    .map .node.running .ring, .map .edge.flow { animation: none; }
    .map .node.running .ring { opacity: .6; r: 20; }
  }
  @media (max-width: 900px) {
    body { height: auto; min-height: 100vh; overflow: auto; }
    header { padding: 20px 16px 8px; }
    .replay { flex-wrap: wrap; }
    .panels { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    .panels > section { overflow: visible; padding: 16px; }
    .trace { border-right: 0; border-bottom: 1px solid var(--line); }
  }

  /* ================= V2: growth planner ================= */
  :root {
    --lane-intake: #8FA1B3;
    --lane-audit-analytics: #7FC97F;
    --lane-audit-catalog: #A9D66B;
    --lane-audit-lifecycle: #F5B94A;
    --lane-audit-paid: #6FA8F5;
    --lane-audit-subs: #B98CF0;
    --lane-audit-stack: #9FB2C4;
    --lane-audit-assembly: #EAF0F5;
    --lane-research-benchmarks: #4DB6C8;
    --lane-research-competitors: #F0876A;
    --lane-research-trends: #A77BE0;
    --lane-opportunities: #EAF0F5;
    --lane-prioritise: #FFB38A;
    --lane-plan: #7DD3C0;
    --src-shopify: #8DB845; --src-klaviyo: #F0C75E; --src-sms: #7AA7FF; --src-meta: #5B8DEF;
    --src-tiktok: #EE5A7A; --src-tiktokshop: #4FD1C5; --src-skio: #B28BF5;
    --src-gorgias: #F29B6B; --src-okendo: #E6C3F0; --src-storefront: #9FB2C4;
    --lane-audit-cx: #F29B6B;
    --lane-journey-first-time: #F28FB5; --lane-journey-returning: #7FD1E8; --lane-journey-subscriber: #C9A6FF;
    --lane-journeys: #F28FB5;
    --warn: #F5B94A;
  }
  .map svg.v2 .label { font-size: 13.5px; }
  .map svg.v2 .sub { font-size: 11.5px; }
  .pill.recomputed { color: var(--ok); border-color: var(--ok); }
  .pill.mismatch { color: var(--warn); border-color: var(--warn); }
  .demo-banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(245,185,74,.1); border: 1px solid rgba(245,185,74,.35); color: #F7D08A;
    border-radius: 8px; padding: 6px 12px; font-size: 13.5px;
  }
  .demo-banner strong { color: var(--live); font-weight: 600; }
  .demo-tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--live); border: 1px solid rgba(245,185,74,.5); border-radius: 4px; padding: 0 5px; vertical-align: 1px; }
  .mode-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .mode-toggle button { background: transparent; border: 0; padding: 5px 14px; color: var(--muted); cursor: pointer; }
  .mode-toggle button + button { border-left: 1px solid var(--line); }
  .mode-toggle button[aria-pressed="true"] { background: var(--text); color: var(--ink); font-weight: 600; }
  .skip-btn { background: var(--live); color: var(--ink); border: 0; border-radius: 6px; padding: 5px 12px; font-weight: 600; cursor: pointer; }

  /* Ask → Clarify → Connect */
  .flow { grid-row: 2 / 5; overflow: auto; padding: 8px 32px 48px; }
  .flow-inner { max-width: 920px; margin: 0 auto; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 22px; color: var(--dim); font-size: 13px; }
  .steps span { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .steps span.on { color: var(--ink); background: var(--text); border-color: var(--text); font-weight: 600; }
  .steps span.done { color: var(--muted); }
  .flow h1 { font-size: clamp(26px, 3vw, 38px); line-height: 1.12; letter-spacing: -.02em; font-weight: 600; margin: 0 0 8px; font-variation-settings: "opsz" 72; }
  .flow .lede { color: var(--muted); margin: 0 0 22px; max-width: 62ch; }
  .store-chip { display: inline-flex; align-items: center; gap: 10px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 6px; margin-bottom: 18px; font-size: 14px; }
  .store-chip .logo { width: 26px; height: 26px; border-radius: 50%; background: #6b4530; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fbeee0; }
  .ask-box { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 12px 20px; }
  .ask-box:focus-within { border-color: var(--live); }
  .ask-box textarea { display: block; width: 100%; min-height: 86px; resize: none; background: transparent; border: 0; padding: 14px 12px 8px 0; font-size: 21px; line-height: 1.35; color: var(--text); }
  .ask-box textarea:focus { outline: none; }
  .ask-box textarea::placeholder { color: var(--dim); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px;
    color: var(--muted); cursor: pointer; font-size: 14px; text-align: left;
  }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .primary-btn { background: var(--text); color: var(--ink); border: 0; border-radius: 9px; padding: 10px 18px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .primary-btn:disabled { opacity: .5; cursor: default; }
  .link-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; border-bottom: 1px solid var(--line); }
  .link-btn:hover { color: var(--text); }
  .qcard { background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .qcard h3 { margin: 0 0 2px; font-size: 17px; font-weight: 600; }
  .qcard .hint { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    display: grid; gap: 2px; text-align: left; background: transparent; border: 1px solid var(--line);

  }
  .opt:hover { border-color: var(--muted); }
  .opt[aria-pressed="true"] { border-color: var(--live); background: rgba(245,185,74,.08); }
  .opt .lbl { font-size: 14.5px; font-weight: 500; }
  .opt .lbl::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--dim); margin-right: 8px; vertical-align: 0; }
  .opt[aria-pressed="true"] .lbl::before { background: var(--live); border-color: var(--live); }
  .opt .why { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  .flow-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  .src-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .src-card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
  .src-card.off { opacity: .55; }
  .src-card .top { display: flex; align-items: center; gap: 10px; }
  .src-card .name { font-weight: 600; flex: 1; }
  .src-card .kind { color: var(--dim); font-size: 12.5px; font-weight: 400; display: block; }
  .src-card .provides { color: var(--muted); font-size: 13.5px; }
  .src-card .state { font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--ok); }
  .src-card.off .state { color: var(--dim); }
  .mono { width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #14202E; background: var(--muted); flex: none; }
  .mono.sm { width: 18px; height: 18px; border-radius: 5px; font-size: 9px; }
  .switch { position: relative; width: 40px; height: 22px; border-radius: 999px; background: var(--line); border: 0; cursor: pointer; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: left .15s; }
  .switch[aria-checked="true"] { background: var(--ok); }
  .switch[aria-checked="true"]::after { left: 21px; background: var(--ink); }
  .switch:disabled { opacity: .6; cursor: default; }
  .speed-pick { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }

  /* Trace entries for store tools and planner outputs */
  .entry.tool .body { display: flex; gap: 8px; align-items: flex-start; }
  .entry.tool .ids { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; color: var(--dim); font-size: 13px; }
  .sev { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 4px; padding: 1px 5px; margin-right: 6px; vertical-align: 1px; }
  .sev.high { color: var(--bad); border: 1px solid var(--bad); }
  .sev.med { color: var(--warn); border: 1px solid var(--warn); }
  .sev.low { color: var(--muted); border: 1px solid var(--dim); }

  ul.plain { list-style: none; margin: 6px 0 0; padding: 0; }

  /* [dN] store-data pills and [cN] web-claim pills */
  .dref, .claim {
    display: inline-block; font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 5px; margin: 0 1px 0 3px;
    border-radius: 4px; vertical-align: 2px; cursor: pointer; border: 1px solid var(--dim); color: var(--muted); font-style: normal;
  }
  .dref { border-color: rgba(125,211,192,.6); color: #9FE3D4; background: rgba(125,211,192,.07); }
  .dref.recomputed { border-color: var(--ok); color: var(--ok); }
  .dref.mismatch { border-color: var(--warn); color: var(--warn); background: rgba(245,185,74,.12); }
  .dref.active, .claim.active { background: var(--ink-3); }
  .pop {
    position: fixed; z-index: 30; max-width: 380px; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.4);
  }
  .pop .ptop { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .pop .val { font-size: 22px; font-weight: 600; margin: 2px 0; }
  .pop .meta { color: var(--muted); font-size: 12.5px; }
  .pop code { font-size: 12px; color: var(--muted); background: var(--ink); padding: 1px 4px; border-radius: 3px; word-break: break-all; }

  /* Plan view: five tabs, full width */
  .planview { grid-row: 4; min-height: 0; overflow: auto; border-top: 1px solid var(--line); }
  .plan-tabs { position: sticky; top: 0; z-index: 2; background: var(--ink); display: flex; gap: 2px; padding: 10px 32px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .plan-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px 10px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 15px; }
  .plan-tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--live); font-weight: 600; }
  .plan-tabs button:disabled { color: var(--dim); cursor: default; }
  .plan-tabs .count { color: var(--dim); font-size: 12.5px; margin-left: 4px; }
  .plan-body { padding: 22px 32px 60px; max-width: 1180px; }
  .plan-body h2 { font-size: 20px; margin: 28px 0 10px; font-weight: 600; letter-spacing: -.01em; }
  .plan-body h2:first-child { margin-top: 0; }
  .plan-body .sub { color: var(--muted); margin: -4px 0 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .tile { background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile .k { color: var(--muted); font-size: 12.5px; }
  .tile .v { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; }
  .section { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; background: rgba(27,42,59,.45); }
  .section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .section-head h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .section .headline { font-size: 15.5px; margin: 6px 0 4px; }
  ul.findings2 { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.findings2 li { padding: 5px 0; border-top: 1px solid var(--ink-3); }
  .flows-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 12px 0 4px; }
  .flow-cell { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 14px; }
  .flow-cell .fn { font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .flow-cell.live { border-color: rgba(111,207,151,.5); }
  .flow-cell.warn { border-color: rgba(245,185,74,.5); }
  .flow-cell.missing { border-style: dashed; color: var(--muted); }

  .flow-cell.live .mark { color: var(--ok); }
  .flow-cell.warn .mark { color: var(--warn); }
  .flow-cell.missing .mark { color: var(--bad); }
  table.grid { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
  table.grid th, table.grid td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--ink-3); vertical-align: top; }
  table.grid th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .table-wrap { overflow-x: auto; }
  .opp { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; background: rgba(27,42,59,.45); overflow: hidden; }
  .opp.locked, .opp.excluded { opacity: .7; border-style: dashed; }

  .rank { font-size: 28px; font-weight: 700; color: var(--live); line-height: 1; letter-spacing: -.02em; }
  .opp.locked .rank, .opp.excluded .rank { color: var(--dim); font-size: 18px; }
  .opp h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; letter-spacing: -.005em; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13.5px; }
  .facts b { color: var(--text); font-weight: 600; }
  .impact { text-align: right; }
  .impact .big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .impact .small { color: var(--muted); font-size: 12.5px; }
  .goalfit { font-size: 11.5px; color: var(--ok); border: 1px solid rgba(111,207,151,.5); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; font-weight: 600; }
  .opp-body { padding: 0 18px 16px 84px; }
  .opp-body h4 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

  details.maths { margin-top: 10px; border: 1px solid var(--line); border-radius: 9px; }
  details.maths summary { cursor: pointer; padding: 8px 12px; color: var(--muted); font-size: 14px; }
  details.maths[open] summary { border-bottom: 1px solid var(--line); }
  .maths-body { padding: 10px 12px; font-size: 14px; }
  .maths-body table { width: 100%; border-collapse: collapse; }
  .maths-body td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--ink-3); vertical-align: top; }
  .maths-body td:first-child { color: var(--muted); width: 170px; }
  .formula { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--ink); padding: 8px 10px; border-radius: 6px; margin-top: 8px; overflow-x: auto; white-space: nowrap; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; font-size: 14px; }
  .meta-grid div span { display: block; color: var(--muted); font-size: 12.5px; }
  .note { color: var(--muted); font-size: 13.5px; }
  .roadmap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 8px 0 26px; }
  .road-col { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .road-col h4 { margin: 0 0 8px; font-size: 14px; }
  .road-col h4 span { color: var(--dim); font-weight: 400; font-size: 12.5px; }
  .road-item { font-size: 13.5px; padding: 6px 8px; border-radius: 7px; background: var(--ink-2); margin-bottom: 6px; border-left: 3px solid var(--line); }
  .road-item.build { border-left-color: var(--live); }
  .road-item.enabler { border-left-color: var(--lane-plan); }
  .road-item.readout { border-left-color: var(--ok); color: var(--muted); }
  .test-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; background: rgba(27,42,59,.45); }
  .test-card h3 { margin: 0 0 10px; font-size: 17px; }
  .test-card table.grid td:first-child { color: var(--muted); width: 170px; }
  .feas { border: 1px dashed rgba(245,185,74,.55); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .feas.ok { border-color: rgba(111,207,151,.55); }
  .teach { background: var(--ink-2); border-radius: 10px; padding: 12px 14px; color: var(--muted); font-size: 14px; margin: 10px 0 20px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
  .filters button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; color: var(--muted); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .filters button[aria-pressed="true"] { border-color: var(--text); color: var(--text); background: var(--ink-3); }
  .summary-actions { margin: 16px 0 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .ghost-card { border: 1px dashed var(--line); border-radius: 12px; padding: 16px 18px; color: var(--muted); margin-bottom: 14px; }
  @media (max-width: 900px) {
    .flow { padding: 8px 16px 40px; }
    .plan-tabs { padding: 8px 16px 0; }
    .plan-body { padding: 18px 16px 48px; }
    .opp-head { grid-template-columns: 34px minmax(0, 1fr); }
    .impact { grid-column: 2; text-align: left; }
    .opp-body { padding: 0 16px 16px; }
    .roadmap { grid-template-columns: 1fr 1fr; }
    .ask-box textarea { font-size: 18px; }
  }
</style>
</head>
<body>
<header>
  <div class="demo-banner" id="banner" hidden><span class="demo-tag">Demo</span><span><strong>Bramble &amp; Bean Coffee Co.</strong> is a fictional store. Every store number is demo data, and every web source is illustrative.</span></div>
  <div id="hero"></div>
  <div class="side">
    <div class="status">
      <span class="live" id="live"><span class="live-dot"></span><span id="clock">0:00</span></span>
      <span id="cost"></span>
      <select id="runs" aria-label="Run"></select>
      <button type="button" class="link" id="new-brief">New question</button>
    </div>
    <div class="mode-toggle" role="group" aria-label="Mode" id="mode-toggle" hidden>
      <button type="button" data-mode="watch" aria-pressed="true">Watch the crew</button>
      <button type="button" data-mode="plan">Plan</button>
    </div>
    <button type="button" class="skip-btn" id="skip" hidden>Skip to the plan</button>
    <div class="view-toggle" role="group" aria-label="View" id="view-toggle" hidden>
      <span class="view-label">Show</span>
      <button type="button" data-view="office" aria-pressed="true">Office</button>
      <button type="button" data-view="map">Pipeline</button>
    </div>
    <div class="replay" id="replay" hidden>
      <button type="button" class="primary" id="play">Replay</button>
      <div class="speeds" role="group" aria-label="Playback speed" id="speeds">
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="2">2×</button>
        <button type="button" data-speed="3">3×</button>
        <button type="button" data-speed="5">5×</button>
        <button type="button" data-speed="10">10×</button>
        <button type="button" data-speed="20">20×</button>
      </div>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position in the run">
      <span id="replay-clock">0:00</span>
    </div>
  </div>
</header>
<section class="composer" id="composer" hidden>
  <form id="composer-form">
    <textarea name="brief" rows="3" placeholder="The question, in the brand's own words. Who you are, where you sell, and what you want to know." required></textarea>
    <div class="composer-row">
      <div class="examples" id="examples">
        <span>Try one</span>
        <button type="button">Magnesium brand, UK/EU: why is retention after order one falling?</button>
        <button type="button">UK coffee subscription launching in Germany</button>
        <button type="button">Protein powder on Shopify vs Amazon Subscribe &amp; Save</button>
      </div>
      <div class="composer-actions">
        <span class="note">Ten to fifteen minutes, about $20.</span>
        <button type="button" class="ghost-btn" id="composer-cancel">Cancel</button>
        <button type="submit" class="start">Start research</button>
      </div>
    </div>
    <div class="form-error" id="composer-error"></div>
  </form>
</section>
<section class="flow" id="flow" hidden><div class="flow-inner" id="flow-inner"></div></section>
<section class="map">
  <canvas id="office" aria-label="The crew at work, as a pixel office"></canvas>
  <svg id="map" role="img" aria-label="Pipeline map" hidden></svg>
</section>
<main class="panels">
  <section class="trace">
    <div class="trace-head">
      <div class="panel-head">
        <h2 id="trace-title">All agents</h2>
        <button type="button" class="ghost-btn" id="all-agents" hidden>All agents</button>
      </div>
      <p class="task" id="trace-task"></p>
    </div>
    <div id="trace-body"></div>
  </section>
  <section class="report">
    <div class="report-head"><button type="button" class="ghost-btn" id="report-expand" hidden>Full screen</button></div>
    <div class="report-status" id="report-status">Nothing yet. The report is written on the second assembly pass.</div>
    <article class="report" id="report"></article>
    <div class="evidence-box" id="evidence" title="Click to dismiss"></div>
  </section>
</main>
<main class="planview" id="planview" hidden>
  <nav class="plan-tabs" id="plan-tabs" role="tablist" aria-label="Plan"></nav>
  <div class="plan-body" id="plan-body"></div>
</main>
<div class="pop" id="pop" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="/config.js"></script>
<script src="/office.js"></script>
<link rel="stylesheet" href="/workspace.css">
<script>
(() => {
  // Where the run server lives. Same origin locally; on the hosted page, config.js names the tunnel
  // to Eric's machine, and ?api= overrides it (remembered per browser) when the tunnel URL changes.
  const API = (() => {
    const param = new URLSearchParams(location.search).get('api');
    let base = param || window.RESEARCH_API || '';
    try { if (param) localStorage.setItem('research.api', param); else if (!base) base = localStorage.getItem('research.api') || ''; } catch {}
    return base.replace(/\/$/, '');
  })();
  const goToRun = (runId) => openRun(runId);
  // v1's fixed order; V2 runs send their own stages in run.started.
  const STAGES = ['brief', 'research', 'assembly', 'followup', 'assembly-2', 'factcheck', 'report'];
  const STAGE_LABELS = { brief: 'Brief', research: 'Research', assembly: 'Assembly', followup: 'Follow-up', 'assembly-2': 'Assembly, second pass', factcheck: 'Fact-check', report: 'Report', intake: 'Brief', audit: 'Store audit', 'audit-assembly': 'Store profile', opportunities: 'Opportunities', prioritise: 'Prioritise', plan: 'Plan' };
  const stagesOf = () => state.stages || STAGES;
  const stageLabel = (s) => (state.stageLabels && state.stageLabels[s]) || STAGE_LABELS[s] || s;
  const ALL = '*';
  const FEED_CAP = 400;
  const laneOf = (agent) => `var(--lane-${agent.stage === 'research' || agent.stage === 'audit' || agent.stage === 'journeys' ? agent.id : agent.stage})`;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const money = (usd) => `$${usd.toFixed(2)}`;
  const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; } };
  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

  /* ---------- state ---------- */
  const freshRun = () => ({
    brief: null, status: 'idle', model: null, error: null,
    agents: new Map(), order: [],
    report: null, claims: [], verdicts: new Map(), counts: null,
    lastT: 0, lastAt: 0, durationMs: null, costUsd: 0,
    // V2
    v2: false, stages: null, stageLabels: null, runBrief: null, store: null, playback: null,
    ledger: new Map(), webFindings: [], profile: null, opps: null, priorities: null, plan: null, tests: null,
    dataClaims: [], reportCounts: null, planVersion: 0,
    // V3
    journeys: {}, journeySteps: {}, analytics: null, scorecard: null, strategy: null, packages: null, reviewDeck: null,
  });
  const state = { runId: null, selected: ALL, stick: true, ...freshRun() };
  const allEvents = [];       // every event of this run, in order, for replay
  let isLive = false;         // an SSE stream that hasn't sent `done` yet
  let traceSeq = 0;
  let renderedReportKey = '';
  // Office hand-offs are decoration for events happening *now*; a backlog (stored run, snapshot
  // of a live run, seek) rebuilds state silently so a hundred sprites don't set off at once.
  let rebuilding = false;
  let backlog = true, lastArrival = 0;
  let view = 'office';
  try { view = localStorage.getItem('research.view') || 'office'; } catch {}

  const office = window.Office;
  if (office) office.init({ canvas: $('office'), getState: () => state, actionOf: (a, d) => actionOf(a, d) });

  const replay = { active: false, playing: false, speed: 1, vt: 0, cursor: 0, last: 0, raf: 0 };
  const maxT = () => (allEvents.length ? allEvents[allEvents.length - 1].t : 0);

  let renderTimer = 0;
  const invalidate = () => { if (!renderTimer) renderTimer = setTimeout(() => { renderTimer = 0; render(); }, 60); };

  function resetRun() {
    Object.assign(state, freshRun());
    state.selected = ALL; state.stick = true;
    renderedReportKey = '';
    $('evidence').innerHTML = '';
  }

  function ensureAgent(id) {
    let a = state.agents.get(id);
    if (!a) {
      a = { id, stage: 'research', label: id, task: '', dependsOn: [], status: 'queued', startedT: null, endT: null, usage: null, trace: [], searches: 0, pulls: 0 };
      state.agents.set(id, a); state.order.push(id);
    }
    return a;
  }
  function pushTrace(agentId, entry, t) {
    const a = ensureAgent(agentId);
    const last = a.trace[a.trace.length - 1];
    if (entry.kind === 'text' && last && last.kind === 'text') { last.text += entry.text; return; }
    const full = { t, seq: traceSeq++, agentId, ...entry };
    // The pipeline reports an agent finished before it publishes its result; keep "Finished" last.
    if (last && last.kind === 'done' && entry.kind !== 'done') { a.trace.splice(a.trace.length - 1, 0, full); return; }
    a.trace.push(full);
  }

  function apply(ev) {
    state.lastT = ev.t; state.lastAt = Date.now();
    switch (ev.type) {
      case 'run.started':
        state.runId = ev.runId; state.brief = ev.brief; state.model = ev.model; state.status = 'running';
        if (ev.stages) { state.v2 = true; state.stages = ev.stages; state.stageLabels = ev.stageLabels || null; state.runBrief = ev.runBrief || null; state.store = ev.store || null; state.playback = ev.playback || null; }
        break;
      case 'run.completed': state.status = 'completed'; state.durationMs = ev.durationMs; state.costUsd = ev.costUsd; break;
      case 'run.failed': state.status = 'failed'; state.error = ev.error; break;
      case 'agent.queued': { const a = ensureAgent(ev.agent.id); Object.assign(a, ev.agent); break; }
      case 'agent.started': { const a = ensureAgent(ev.agentId); a.status = 'running'; a.startedT = ev.t; break; }
      case 'agent.thinking': pushTrace(ev.agentId, { kind: 'thinking', text: ev.text }, ev.t); break;
      case 'agent.text': pushTrace(ev.agentId, { kind: 'text', text: ev.text }, ev.t); break;
      case 'agent.search': { const a = ensureAgent(ev.agentId); a.searches += 1; pushTrace(ev.agentId, { kind: 'search', query: ev.query, results: null }, ev.t); break; }
      case 'agent.search.results': {
        const a = ensureAgent(ev.agentId);
        const open = [...a.trace].reverse().find((e) => e.kind === 'search' && e.results === null && e.query === ev.query)
          || [...a.trace].reverse().find((e) => e.kind === 'search' && e.results === null);
        if (open) open.results = ev.results; else pushTrace(ev.agentId, { kind: 'search', query: ev.query, results: ev.results }, ev.t);
        break;
      }
      case 'agent.fetch': pushTrace(ev.agentId, { kind: 'fetch', url: ev.url }, ev.t); break;
      case 'agent.completed': { const a = ensureAgent(ev.agentId); a.status = 'completed'; a.endT = ev.t; a.usage = ev.usage; if (a.stage !== 'brief' && a.stage !== 'report') pushTrace(ev.agentId, { kind: 'done', durationMs: ev.durationMs, usage: ev.usage }, ev.t); break; }
      case 'agent.failed': { const a = ensureAgent(ev.agentId); a.status = 'failed'; a.endT = ev.t; pushTrace(ev.agentId, { kind: 'failed', error: ev.error }, ev.t); break; }
      case 'findings': pushTrace(ev.agentId, { kind: 'findings', headline: ev.headline, findings: ev.findings }, ev.t); for (const f of ev.findings) if (f.id) state.webFindings.push({ agentId: ev.agentId, ...f }); state.planVersion++; break;
      case 'assembly.result': pushTrace('assembly', { kind: 'assembly', summary: ev.summary, contradictions: ev.contradictions, gaps: ev.gaps }, ev.t); break;
      case 'followup.answer': pushTrace(ev.agentId, { kind: 'answer', answer: ev.answer, findings: ev.findings }, ev.t); for (const f of ev.findings) if (f.id) state.webFindings.push({ agentId: ev.agentId, ...f }); break;
      case 'report.draft': state.report = ev.markdown; state.claims = ev.claims; state.dataClaims = ev.dataClaims || []; state.planVersion++; break;
      case 'factcheck.verdicts': state.verdicts = new Map(ev.verdicts.map((v) => [v.id, v])); pushTrace('factcheck', { kind: state.v2 ? 'verdicts2' : 'verdicts', verdicts: ev.verdicts }, ev.t); state.planVersion++; break;
      case 'report.final': state.report = ev.markdown; state.counts = { supported: ev.supported, unsupported: ev.unsupported, contradicted: ev.contradicted }; state.reportCounts = ev.counts || null; state.planVersion++; break;
      // V2: store tools, the ledger, and the planner's outputs
      case 'tool.call': { const a = ensureAgent(ev.agentId); a.pulls += 1; pushTrace(ev.agentId, { kind: 'tool', source: ev.source, tool: ev.tool, args: ev.args, callId: ev.callId, ledgerIds: null }, ev.t); break; }
      case 'tool.result': { const a = ensureAgent(ev.agentId); const open = [...a.trace].reverse().find((e) => e.kind === 'tool' && e.callId === ev.callId); if (open) open.ledgerIds = ev.ledgerIds; break; }
      case 'ledger.entry': state.ledger.set(ev.entry.id, ev.entry); break;
      case 'audit.findings': pushTrace(ev.agentId, { kind: 'audit', area: ev.area, headline: ev.headline, findings: ev.findings }, ev.t); break;
      case 'audit.profile': state.profile = ev.profile; pushTrace('audit-assembly', { kind: 'profile', profile: ev.profile }, ev.t); state.planVersion++; break;
      case 'opportunities': state.opps = ev.items; pushTrace('opportunity-assembly', { kind: 'opps', items: ev.items, followups: ev.followups }, ev.t); break;
      case 'priorities': state.priorities = ev.items; pushTrace('prioritiser', { kind: 'priorities', items: ev.items }, ev.t); state.planVersion++; break;
      case 'plan.draft': state.plan = { initiatives: ev.initiatives, roadmap: ev.roadmap }; pushTrace('planner', { kind: 'plan', initiatives: ev.initiatives }, ev.t); state.planVersion++; break;
      case 'tests.draft': state.tests = { tests: ev.tests, feasibility: ev.feasibility }; pushTrace('planner', { kind: 'tests', tests: ev.tests, feasibility: ev.feasibility }, ev.t); state.planVersion++; break;
      // V3: shopper journeys, analytics, strategy, build kits
      case 'journey.step': (state.journeySteps[ev.journey] ||= []).push(ev.step); pushTrace(ev.agentId, { kind: 'jstep', step: ev.step }, ev.t); state.planVersion++; break;
      case 'journey.done': state.journeys[ev.journey.id] = ev.journey; state.planVersion++; break;
      case 'analytics.pack': state.analytics = ev.pack; state.scorecard = ev.scorecard; pushTrace('growth-analyst', { kind: 'analytics', pack: ev.pack, scorecard: ev.scorecard }, ev.t); state.planVersion++; break;
      case 'strategy.stack': state.strategy = ev.strategy; pushTrace('sub-strategist', { kind: 'strategy', strategy: ev.strategy }, ev.t); state.planVersion++; break;
      case 'build.packages': state.packages = ev.packages; pushTrace('build-kits', { kind: 'kits', packages: ev.packages }, ev.t); state.planVersion++; break;
      case 'review.deck': state.reviewDeck = ev.cards; state.planVersion++; break;
    }
    if (office && !state.v2 && !rebuilding && !(backlog && !replay.active)) {
      office.onEvent(ev);
      if (ev.type === 'agent.queued') office.onQueued(ev.agent.id);

  }
  function receive(ev) {
    const now = performance.now();
    // A burst of messages with no real-time gap is history being replayed to us, not the run happening.
    if (backlog && lastArrival && now - lastArrival > 400) backlog = false;

  }

  /* What an agent is doing right now, from its latest trace entry. */
  function actionOf(a, detailed) {
    if (a.status !== 'running') return '';
    const e = a.trace[a.trace.length - 1];
    if (!e) return 'starting';
    switch (e.kind) {
      case 'search': return e.results === null ? (detailed ? `searching “${clip(e.query, 48)}”` : 'searching') : (detailed ? `reading results for “${clip(e.query, 40)}”` : 'reading results');
      case 'fetch': return detailed ? `reading a page on ${hostOf(e.url)}` : 'reading a page';
      case 'tool': return e.ledgerIds === null ? (detailed ? `pulling ${toolPhrase(e.tool)} from ${srcLabel(e.source)}` : `pulling ${srcLabel(e.source)}`) : 'reading the numbers';
      case 'thinking': return 'thinking';
      case 'text': return a.stage === 'research' || a.stage === 'followup' ? 'writing' : 'writing';
      default: return 'working';
    }
  }

  /* ---------- replay ---------- */
  function startReplay() {
    resetRun(); office?.reset(); planMode = 'watch';
    replay.active = true; replay.vt = 0; replay.cursor = 0; replay.playing = true; replay.last = performance.now();

    replay.raf = requestAnimationFrame(tick);
    invalidate();
  }
  function drain() {
    while (replay.cursor < allEvents.length && allEvents[replay.cursor].t <= replay.vt) apply(allEvents[replay.cursor++]);
  }
  function tick(now) {
    if (!replay.playing) return;
    replay.vt += (now - replay.last) * replay.speed; replay.last = now;
    drain();
    if (replay.cursor >= allEvents.length && !isLive) { replay.vt = maxT(); replay.playing = false; }
    else replay.raf = requestAnimationFrame(tick);
    invalidate();
  }
  function seek(t) {
    resetRun(); office?.reset();

    invalidate();

    invalidate();
  }
  function setView(v) {

    invalidate();
  }

  $('play').addEventListener('click', () => {

    invalidate();

  $('speeds').addEventListener('click', (e) => {

  $('scrub').addEventListener('input', (e) => { seek((Number(e.target.value) / 1000) * maxT()); });

  /* ---------- header ---------- */
  /* ---------- composer ---------- */
  const EXAMPLES = [
    "We are a magnesium brand that primarily operates in the UK/EU market. Our retention after order 1 has been declining and we want to know why?",
    "We're a UK specialty coffee subscription brand, about 40,000 active subscribers paying around £18 a month, and we plan to launch in Germany in Q1 2027. What do German consumers expect from a coffee subscription, who would we be competing with and how do they price and keep customers, and what regulation or logistics could trip us up?",
    "We sell a $45-a-month protein powder subscription on Shopify in the US. Amazon Subscribe & Save just cut prices across our category. Should we match, what are the other DTC brands doing, and what do subscribers actually switch for?",

  let composerOpen = false, noRunsYet = false;

  function renderHeader() {

    else if (state.brief) hero.innerHTML = `<p class="brief">${esc(state.brief)}</p>${state.v2 && state.runBrief ? `<div class="note" style="margin-top:4px">${esc(state.store?.name || '')} <span class="demo-tag">Demo data</span> · ${briefBits(state.runBrief).map(esc).join(' · ')}</div>` : ''}`;

    // The pixel office only knows v1's desks; V2 runs show the pipeline map.

  /* ---------- map ---------- */
  const NODE_R = 14, COL_W1 = 208, ROW_H1 = 84, TOP = 50;
  function renderMap() {
    const svg = $('map');
    const STAGES = stagesOf();
    const COL_W = state.v2 ? 150 : COL_W1, ROW_H = state.v2 ? (Math.max(...[...new Map(stagesOf().map((s) => [s, 0]))].map(([st]) => state.order.filter((id) => state.agents.get(id)?.stage === st).length)) > 6 ? 70 : 78) : ROW_H1;
    svg.classList.toggle('v2', !!state.v2);
    const byStage = new Map(STAGES.map((s) => [s, []]));
    for (const id of state.order) { const a = state.agents.get(id); if (byStage.has(a.stage)) byStage.get(a.stage).push(a); }
    // The ghost "Follow-ups" node sits between whichever stages surround the follow-up column.
    const fIdx = STAGES.indexOf('followup');
    const ghostFollowup = fIdx >= 0 && byStage.get('followup').length === 0;
    const ghostFrom = fIdx > 0 ? byStage.get(STAGES[fIdx - 1]) : [];
    const ghostTo = fIdx >= 0 && fIdx < STAGES.length - 1 ? byStage.get(STAGES[fIdx + 1]) : [];
    const assembly = ghostFrom[0];
    const rows = Math.max(3, ...[...byStage.values()].map((l) => l.length));
    const width = STAGES.length * COL_W, height = TOP + rows * ROW_H + 52;
    const pos = new Map();
    STAGES.forEach((stage, ci) => {
      const list = byStage.get(stage);
      const n = ghostFollowup && stage === 'followup' ? 1 : list.length;
      const cx = ci * COL_W + COL_W / 2;
      const cy = (i) => TOP + (rows * ROW_H) / 2 + (i - (n - 1) / 2) * ROW_H;
      list.forEach((a, i) => pos.set(a.id, { x: cx, y: cy(i) }));
      if (ghostFollowup && stage === 'followup') pos.set('__ghost', { x: cx, y: cy(0) });
    });

    let edges = '', nodes = '', heads = '';
    STAGES.forEach((stage, ci) => { heads += `<text class="stage" x="${ci * COL_W + COL_W / 2}" y="20" text-anchor="middle">${esc(stageLabel(stage))}</text>`; });

    const edge = (from, to, lane, cls) => {
      const a = pos.get(from), b = pos.get(to); if (!a || !b) return '';
      const x1 = a.x + NODE_R + 3, x2 = b.x - NODE_R - 3, mx = (x1 + x2) / 2;
      return `<path class="edge ${cls}" d="M${x1},${a.y} C${mx},${a.y} ${mx},${b.y} ${x2},${b.y}" style="stroke:${lane}"/>`;
    };
    for (const id of state.order) {
      const a = state.agents.get(id);
      const cls = a.status === 'running' ? 'flow' : a.status === 'completed' ? 'done' : '';
      for (const dep of a.dependsOn) edges += edge(dep, a.id, laneOf(a), cls);
    }
    if (ghostFollowup && assembly) {
      for (const from of ghostFrom) edges += edge(from.id, '__ghost', 'var(--lane-followup)', from.status === 'completed' ? 'done' : '');
      for (const to of ghostTo) edges += edge('__ghost', to.id, laneOf(to), to.status === 'running' ? 'flow' : to.status === 'completed' ? 'done' : '');
    }

    const subOf = (a) => {
      if (a.stage === 'brief' || a.stage === 'intake') return '';
      if (a.status === 'running' && a.pulls) return `${actionOf(a)} (${a.pulls} pull${a.pulls === 1 ? '' : 's'})`;
      if (a.stage === 'report') return a.status === 'completed' ? 'ready' : 'waiting';
      if (a.status === 'running') { const act = actionOf(a); return a.searches ? `${act} (${a.searches} search${a.searches === 1 ? '' : 'es'})` : act; }
      if (a.status === 'completed') return a.endT != null && a.startedT != null ? mmss(a.endT - a.startedT) : '';
      if (a.status === 'failed') return 'failed';

    };
    for (const id of state.order) {
      const a = state.agents.get(id), p = pos.get(id); if (!p) continue;
      const lane = laneOf(a);

        <circle class="ring" cx="${p.x}" cy="${p.y}" r="${NODE_R}" style="stroke:${lane}"/>
        <circle class="halo" cx="${p.x}" cy="${p.y}" r="${NODE_R + 6}"/>
        <circle class="core" cx="${p.x}" cy="${p.y}" r="${NODE_R}" style="stroke:${lane}"/>
        <path class="tick" d="M${p.x - 5.5},${p.y + 0.5} L${p.x - 1.5},${p.y + 4.5} L${p.x + 6},${p.y - 4.5}"/>
        <path class="cross" d="M${p.x - 5},${p.y - 5} L${p.x + 5},${p.y + 5} M${p.x + 5},${p.y - 5} L${p.x - 5},${p.y + 5}"/>
        <text class="label" x="${p.x}" y="${p.y + 33}" text-anchor="middle">${esc(a.label)}</text>
        <text class="sub" x="${p.x}" y="${p.y + 50}" text-anchor="middle">${esc(subOf(a))}</text>
      </g>`;
    }
    if (ghostFollowup) {
      const p = pos.get('__ghost');
      const sub = !assembly || assembly.status !== 'completed' ? `decided by ${state.v2 ? 'opportunities' : 'assembly'}` : 'no gaps found';
      nodes += `<g class="node ghost" aria-hidden="true">
        <circle class="core" cx="${p.x}" cy="${p.y}" r="${NODE_R}"/>
        <text class="label" x="${p.x}" y="${p.y + 33}" text-anchor="middle">Follow-ups</text>
        <text class="sub" x="${p.x}" y="${p.y + 50}" text-anchor="middle">${sub}</text>
      </g>`;
    }
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.style.minWidth = state.v2 ? '1240px' : '';
    svg.innerHTML = heads + edges + nodes;
  }
  $('map').addEventListener('click', (e) => { const g = e.target.closest('.node[data-id]'); if (g) select(g.dataset.id); });
  $('map').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { const g = e.target.closest('.node[data-id]'); if (g) { e.preventDefault(); select(g.dataset.id); } } });
  function select(id) { state.selected = state.selected === id ? ALL : id; state.stick = true; invalidate(); }
  $('all-agents').addEventListener('click', () => select(ALL));

  /* ---------- trace ---------- */
  function renderTrace() {
    const body = $('trace-body');
    const panel = body.closest('section');
    const nearBottom = panel.scrollHeight - panel.scrollTop - panel.clientHeight < 80;
    const all = state.selected === ALL;
    $('all-agents').hidden = all;
    let entries;
    if (all) {
      $('trace-title').textContent = 'All agents';
      $('trace-task').textContent = state.runId ? 'Everything the crew is doing, in the order it happened.' : '';
      entries = [];
      for (const id of state.order) { const a = state.agents.get(id); if (a.stage !== 'brief' && a.stage !== 'intake' && a.stage !== 'report') entries.push(...a.trace); }
      entries.sort((x, y) => x.t - y.t || x.seq - y.seq);
      if (!state.runId) { body.innerHTML = '<p class="empty">Start a brief above, or pick a past run.</p>'; return; }
      if (entries.length === 0) { body.innerHTML = '<p class="empty">The crew is starting.</p>'; return; }
    } else {

  /** A small Markdown renderer for when marked (CDN) isn't available, e.g. the offline file. */
  function miniMarkdown(md) {

  }
  function briefBits(rb) {
    const L = { convert_one_time_to_sub: 'Convert one-time buyers', reduce_churn: 'Reduce churn', acquire_direct: 'Acquire subscribers', raise_rev_per_sub: 'Revenue per subscriber', next_30_days: 'Next 30 days', this_quarter: 'This quarter (Q4)', next_6_months: 'Next 6 months', solo: 'Just me', small_team: 'Small team', agency: 'Agency' };
    const bits = [];
    if (rb.goal) bits.push(L[rb.goal] || rb.goal);
    if (rb.timeframe) bits.push(L[rb.timeframe] || rb.timeframe);
    if (rb.capacity) bits.push(L[rb.capacity] || rb.capacity);
    if (rb.competitors?.length) bits.push(`vs ${rb.competitors.join(', ')}`);
    if (rb.sources) { const on = SRC_ORDER.filter((s) => rb.sources[s] !== false); bits.push(`${on.length} of ${SRC_ORDER.length} sources`); }
    return bits;
  }

  /* ---------- popovers for [dN] and [cN] ---------- */
  function showPop(el) {
    const pop = $('pop'); let html = '';
    const d = el.dataset.d, c = el.dataset.c;
    if (d) {
      const e = state.ledger.get(d); const v = state.verdicts.get(d);
      if (!e) return;
      html = `<div class="ptop">${mono(e.source, false)}<div><div style="font-weight:600">${esc(srcLabel(e.source))}</div><div class="meta">${esc(d)} · <span class="demo-tag">Demo data</span></div></div></div>
        <div>${esc(e.label)}</div><div class="val">${esc(fmtValue(e.value, e.unit))}</div>
        <div class="meta">${e.window ? `Window: ${esc(e.window)} · ` : ''}As of ${esc(e.asOf)}</div>
        <div class="meta" style="margin-top:6px"><code>${esc(e.tool)}(${esc(Object.entries(e.args).map(([k, x]) => `${k}=${x}`).join(', '))})</code> → <code>${esc(e.field)}</code></div>
        ${v ? `<div style="margin-top:8px"><span class="pill ${esc(v.verdict)}" style="color:${v.verdict === 'mismatch' ? 'var(--warn)' : 'var(--ok)'};border-color:currentColor">${v.verdict === 'mismatch' ? 'corrected' : 'recomputed'}</span> <span class="meta">${pt(v.evidence)}</span></div>` : ''}`;
    } else if (c) {
      const f = state.webFindings.find((x) => x.id === c); const v = state.verdicts.get(c);
      if (!f) return;
      html = `<div class="meta">${esc(c)} · web claim · ${esc(f.confidence)} confidence</div><div style="margin:4px 0 6px;font-weight:500">${esc(f.claim)}</div>
        <div class="meta">${esc(f.evidence)}</div>${f.sources.map((s) => `<div class="meta" style="margin-top:6px"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join('')}
        ${v ? `<div style="margin-top:8px"><span class="pill ${esc(v.verdict)}">${esc(v.verdict)}</span> <span class="meta">${esc(v.evidence)}</span></div>` : '<div class="meta" style="margin-top:8px">Not fact-checked yet.</div>'}`;
    } else return;
    document.querySelectorAll('.dref.active, .claim.active').forEach((x) => x.classList.remove('active'));
    el.classList.add('active');
    pop.innerHTML = html; pop.hidden = false;
    const r = el.getBoundingClientRect(); const w = Math.min(380, window.innerWidth - 24);
    pop.style.maxWidth = `${w}px`;
    const ph = pop.offsetHeight;
    const left = Math.max(12, Math.min(r.left - 20, window.innerWidth - w - 12));
    const top = r.bottom + 8 + ph < window.innerHeight ? r.bottom + 8 : Math.max(12, r.top - ph - 8);
    pop.style.left = `${left}px`; pop.style.top = `${top}px`;
  }
  const hidePop = () => { $('pop').hidden = true; document.querySelectorAll('.dref.active, .claim.active').forEach((x) => x.classList.remove('active')); };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('.dref[data-d], .claim[data-c]');
    if (el) { e.stopPropagation(); showPop(el); return; }
    if (!e.target.closest('#pop')) hidePop();
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hidePop();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.dref[data-d], .claim[data-c]')) { e.preventDefault(); showPop(e.target); }
  });
  document.addEventListener('scroll', hidePop, true);

  /* ---------- trace entries for V2 kinds ---------- */
  function v2EntryHtml(e) {
    switch (e.kind) {
      case 'tool': {
        const args = Object.values(e.args || {});
        const ids = e.ledgerIds === null ? 'pulling…' : e.ledgerIds.length ? `${e.ledgerIds.length} data point${e.ledgerIds.length === 1 ? '' : 's'} recorded ${e.ledgerIds.map((id) => pt(`[${id}]`)).join('')}` : 'no numbers returned';
        return `${mono(e.source)}<div><div>Pulled ${esc(toolPhrase(e.tool))}${args.length ? ` (${esc(args.join(', '))})` : ''} from ${esc(srcLabel(e.source))}</div><div class="ids">${ids}</div></div>`;
      }
      case 'audit': return `<div class="headline">${pt(e.headline)}</div><ul class="plain">${e.findings.map((f) => `<li>${sevTag(f)}${pt(f.claim)}</li>`).join('')}</ul>`;
      case 'profile': return `<div class="headline">Store Profile ready: ${state.ledger.size} data points.</div><div>${pt(e.profile.headline)}</div>${e.profile.contradictions.length ? `<div class="note" style="margin-top:6px">${e.profile.contradictions.length} place${e.profile.contradictions.length === 1 ? '' : 's'} where sources disagree: ${e.profile.contradictions.map((c) => esc(c.topic)).join('; ')}.</div>` : ''}<div class="headline" style="margin-top:8px">Questions for research</div><ol style="margin:4px 0 0;padding-left:18px">${e.profile.researchQuestions.map((q) => `<li>${esc(q)}</li>`).join('')}</ol>`;
      case 'opps': return `<div class="headline">${e.items.length} opportunities, each with store data behind it</div><ul class="plain">${e.items.map((o) => `<li>${esc(o.title)}</li>`).join('')}</ul>${e.followups.length ? `<div class="headline" style="margin-top:8px">${e.followups.length} follow-up${e.followups.length === 1 ? '' : 's'}</div><ul class="plain">${e.followups.map((f) => `<li><span class="sev low">${f.kind}</span>${esc(f.question)}</li>`).join('')}</ul>` : ''}`;
      case 'priorities': return `<div class="headline">Ranked by dollar score</div><ol style="margin:4px 0 0;padding-left:18px">${e.items.filter((o) => o.rank).map((o) => `<li>${esc(o.title)}: <strong>${usdShort(o.annualImpact)}/yr</strong> <span class="note">score ${usdShort(o.score)}</span></li>`).join('')}</ol>${e.items.some((o) => o.locked) ? `<div class="note" style="margin-top:4px">${e.items.filter((o) => o.locked).length} locked (source off)</div>` : ''}${e.items.some((o) => o.excluded) ? `<div class="note">${e.items.filter((o) => o.excluded).length} ruled out by a constraint</div>` : ''}`;
      case 'plan': return `<div class="headline">Action plans for ${e.initiatives.length} moves, plus a 30/60/90 roadmap</div><ul class="plain">${e.initiatives.map((i) => `<li>#${i.rank} ${esc(i.title)}: ${i.steps.length} steps</li>`).join('')}</ul>`;
      case 'tests': return `<div class="headline">${e.tests.length} test designs</div><ul class="plain">${e.tests.map((x) => `<li>#${x.rank}: ~${num(x.nPerArm)} per arm, ~${Math.round(x.totalWeeks)} weeks</li>`).join('')}</ul>${e.feasibility.map((f) => `<div class="note">Not feasible as asked: ${esc(f.name)} (needs ~${num(f.nPerArm)} per arm)</div>`).join('')}`;
      case 'jstep': {
        const st = e.step;
        const tag = st.verdict === 'good' ? '<span class="sev good">working</span>' : st.verdict === 'info' ? '<span class="sev low">note</span>' : `<span class="sev ${esc(st.severity || 'med')}">${st.severity === 'med' ? 'medium' : esc(st.severity || 'issue')}</span>`;
        return `<div class="headline">${st.device === 'mobile' ? '📱' : '💻'} ${esc(st.place)}</div><div>${tag}${esc(st.saw)}</div><div class="evidence" style="margin-top:3px">${pt(st.why)}</div>`;
      }
      case 'analytics': return `<div class="headline">${esc(e.pack.headline)}</div><ul class="plain">${e.scorecard.map((a) => `<li><strong>${esc(a.grade)}</strong> · ${esc(a.area)}</li>`).join('')}</ul><div class="note">${e.pack.charts.length} charts for the plan</div>`;
      case 'strategy': return `<div class="headline">Subscription maturity across the stack: ${e.strategy.maturity}/100</div><ul class="plain">${e.strategy.stack.map((t) => `<li>${'●'.repeat(t.maturity)}${'○'.repeat(4 - t.maturity)} ${esc(t.tool)}</li>`).join('')}</ul>`;
      case 'kits': return `<div class="headline">${e.packages.length} build kits ready</div><ul class="plain">${e.packages.map((k) => `<li>${esc(k.title)}: ${k.assets.length} pieces, ${k.walkthrough.length} steps</li>`).join('')}</ul>`;
      case 'verdicts2': {
        const web = e.verdicts.filter((v) => v.id.startsWith('c')), data = e.verdicts.filter((v) => v.id.startsWith('d'));
        const odd = data.filter((v) => v.verdict !== 'recomputed');
        return `<ul class="verdict-list">${web.map((v) => `<li><span class="pill ${esc(v.verdict)}">${esc(v.id)} ${esc(v.verdict)}</span><div>${esc(v.evidence)}</div></li>`).join('')}</ul>
          <div class="headline" style="margin-top:8px">${data.length - odd.length} of ${data.length} store numbers recomputed from the ledger and matched</div>
          <ul class="verdict-list">${odd.map((v) => `<li><span class="pill" style="color:var(--warn);border-color:var(--warn)">${esc(v.id)} corrected</span><div>${pt(v.evidence)}</div></li>`).join('')}</ul>`;
      }
      default: return '';
    }
  }

  /* ---------- the right-hand panel while watching a V2 run ---------- */
  function renderV2Report() {
    const status = $('report-status');
    if (!state.report) {
      const running = [...state.agents.values()].filter((a) => a.status === 'running' && a.stage !== 'intake');
      if (state.status === 'failed') status.textContent = `The run stopped: ${state.error || 'unknown error'}`;
      else if (running.length) status.innerHTML = `<ul class="now-list">${running.map((a) => `<li><span class="who" style="--lane:${laneOf(a)}">${esc(a.label)}</span><span class="what">${esc(actionOf(a, true))}</span></li>`).join('')}</ul>`;
      else status.textContent = 'Waiting for the next stage.';
      const done = [state.profile && 'Store context', state.priorities && 'Ranked plan', state.tests && 'Test plan'].filter(Boolean);
      $('report').innerHTML = `<p class="empty" style="margin-top:18px">${state.ledger.size ? `${state.ledger.size} store data points in the ledger so far.` : 'The auditors are about to pull store data.'} The plan appears here when the planner and fact-checker are done.</p>${done.length ? `<p><button type="button" class="ghost-btn" data-open-plan>Peek at the plan so far (${esc(done.join(', '))})</button></p>` : ''}`;
      renderedReportKey = '';
      return;
    }
    status.innerHTML = countsLine();
    const key = `v2:${state.report.length}:${state.verdicts.size}`;
    if (key === renderedReportKey) return;
    renderedReportKey = key;
    $('report').innerHTML = `<p><button type="button" class="primary-btn" data-open-plan>Open the full plan</button></p>${pillify(markdown(state.report), true)}`;
  }
  $('report').addEventListener('click', (e) => { if (e.target.closest('[data-open-plan]')) { planMode = 'plan'; if (replay.playing) replay.playing = false; invalidate(); } });

  // The V3 plan workspace (workspace.js) reads state and shared helpers from here.
  window.GP = { state, esc, pt, pillify, markdown, mono, srcLabel, fmtValue, usdShort, pctS, num, invalidate, transport, post, API, LOCAL, laneOf, modeOf, briefBits, SRC_ORDER, authHeaders: () => (password ? { 'x-demo-password': password } : {}), setPlanMode: (m) => { planMode = m; invalidate(); } };
  function render() { renderHeader(); renderFlow(); if (flow.screen) return; if (state.v2 && modeOf() === 'plan') { renderPlan(); return; } renderedPlanKey = ''; renderMap(); renderTrace(); renderReport(); }
  setInterval(() => { if (state.status === 'running' && !replay.active) renderHeader(); }, 1000);

  /* ---------- runs & stream ---------- */
  async function loadRuns(current) {
    const sel = $('runs');
    let runs = [];
    try {
      runs = await transport.runs();
      sel.innerHTML = `<option value="">${runs.length ? 'Past runs' : 'No runs yet'}</option>` + runs.map((r) => `<option value="${esc(r.runId)}" ${r.runId === current ? 'selected' : ''}>${esc(r.brief.slice(0, 60))}${r.brief.length > 60 ? '…' : ''} (${r.status})</option>`).join('');
      if (current && !runs.some((r) => r.runId === current)) sel.insertAdjacentHTML('beforeend', `<option value="${esc(current)}" selected>${esc(current)}</option>`);
    } catch { sel.innerHTML = '<option value="">Runs unavailable</option>'; }
    return runs;
  }
  $('runs').addEventListener('change', (e) => { if (e.target.value) goToRun(e.target.value); });
  if (API) $('cost').insertAdjacentHTML('afterend', `<span title="${esc(API)}" style="color:var(--dim)">via ${esc(new URL(API).hostname)}</span>`);

  function connect(runId) {
    if (LOCAL) { if (!connectLocal(runId)) openFlow('ask'); return; }
    isLive = true;
    const es = new EventSource(`${API}/api/runs/${encodeURIComponent(runId)}/events`);
    activeStream = es;
    es.onmessage = (m) => { try { receive(JSON.parse(m.data)); } catch (err) { console.error(err); } };
    es.addEventListener('done', () => { isLive = false; es.close(); invalidate(); });
    es.onerror = () => { if (state.status !== 'running') { isLive = false; es.close(); invalidate(); } };
  }

  // Open on the run in the URL; with none, on the latest run — the composer is a click away. An
  // empty install (no runs at all) opens the composer.
  // Open on the run in the URL; with none, on the Ask screen (past runs are in the picker).
  (async () => {
    const wanted = new URLSearchParams(location.search).get('run');
    // Deep links for demos: ?run=<id>&mode=watch|plan&tab=summary|context|ranked|tests|sources
    const qp = new URLSearchParams(location.search);
    if (qp.get('mode')) planMode = qp.get('mode');
    if (qp.get('tab')) planTab = qp.get('tab');
    try { demoInfo = await transport.store(); } catch { demoInfo = null; }
    if (wanted && (!LOCAL || localRuns.has(wanted))) connect(wanted);
    else openFlow('ask');
    render();
    await loadRuns(wanted);
  })();
  window.addEventListener('popstate', () => { const r = new URLSearchParams(location.search).get('run'); if (r && r !== state.runId) openRun(r, true); });
})();
</script>
<script src="/workspace.js"></script>
</body>
</html>
